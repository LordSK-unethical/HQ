<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
  <title>HQ Time Client</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      background: #16171a;
      color: #e6e6e6;
    }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    .row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #2a2b2f; font-size: 0.9rem; }
    .row span:first-child { color: #9a9aa0; }
    #status { margin-top: 1rem; font-size: 0.85rem; min-height: 1.2em; }
    .error { color: #ff6b6b; }
    .ok { color: #51cf66; }
    button {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      background: #4c6ef5;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <h1>HQ Time Client</h1>
  <div class="row"><span>ISO</span><span id="iso">--</span></div>
  <div class="row"><span>Unix</span><span id="unix">--</span></div>
  <div class="row"><span>UTC</span><span id="utc">--</span></div>
  <button id="refresh">Fetch server time</button>
  <p id="status"></p>

  <script src="renderer.js"></script>
</body>
</html>
